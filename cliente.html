
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nerocar | Solicitar corrida</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px;
  background:#101010;
  color:#fff;
  font-family:Arial,sans-serif;
}
.container{
  max-width:500px;
  margin:25px auto;
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:18px;
  padding:24px;
  box-shadow:0 10px 35px #0008;
}
.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  color:#f5c400;
  margin-bottom:5px;
}
.subtitulo{
  text-align:center;
  color:#aaa;
  margin-bottom:25px;
}
h2{
  font-size:20px;
  margin-top:0;
}
label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
  font-size:14px;
}
input,textarea{
  width:100%;
  padding:14px;
  border:1px solid #444;
  border-radius:9px;
  background:#292929;
  color:white;
  font-size:16px;
  outline:none;
}
input:focus,textarea:focus{border-color:#f5c400}
textarea{resize:vertical;min-height:75px}
button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:9px;
  background:#f5c400;
  color:#111;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  margin-top:18px;
}
button:disabled{opacity:.5;cursor:not-allowed}
.secundario{
  background:#333;
  color:white;
}
.preco{
  text-align:center;
  padding:15px;
  background:#292929;
  border-radius:10px;
  margin:20px 0;
}
.preco strong{
  display:block;
  color:#f5c400;
  font-size:30px;
  margin-top:5px;
}
.status{
  padding:15px;
  background:#292929;
  border-radius:10px;
  margin:15px 0;
  line-height:1.5;
}
.destaque{color:#f5c400;font-weight:bold}
.motorista{
  background:#292929;
  border:1px solid #555;
  padding:15px;
  border-radius:10px;
  line-height:1.8;
  margin-top:15px;
}
.escondido{display:none!important}
#mensagens{
  height:230px;
  overflow-y:auto;
  background:#111;
  border:1px solid #444;
  border-radius:10px;
  padding:10px;
  margin-top:12px;
}
.mensagem{
  padding:9px 11px;
  margin:7px 0;
  border-radius:9px;
  background:#303030;
  overflow-wrap:anywhere;
}
.mensagem strong{color:#f5c400}
.horario{font-size:11px;color:#999}
.aviso{
  color:#bbb;
  font-size:13px;
  text-align:center;
  line-height:1.5;
  margin-top:18px;
}
.erro{color:#ff7777}
.sucesso{color:#7ee6a1}
</style>
</head>

<body>

<div class="container">
  <div class="logo">Nerocar</div>
  <div class="subtitulo">Sua viagem começa aqui</div>

  <section id="telaSolicitacao">
    <h2>Solicitar uma corrida</h2>

    <label for="nome">Seu nome</label>
    <input id="nome" type="text" placeholder="Digite seu nome" maxlength="100" required>

    <label for="endereco">Endereço de origem</label>
    <textarea id="endereco" placeholder="Digite o endereço onde deseja ser buscado" maxlength="500" required></textarea>

    <label for="referencia">Ponto de referência (opcional)</label>
    <input id="referencia" type="text" placeholder="Ex.: próximo à praça" maxlength="300">

    <div class="preco">
      Valor da corrida dentro de Nerópolis
      <strong>R$ 18,00</strong>
    </div>

    <button id="btnSolicitar" onclick="solicitarCorrida()">
      SOLICITAR CORRIDA
    </button>

    <div id="mensagemInicial" class="aviso">
      Informe seus dados e solicite sua viagem.
    </div>
  </section>

  <section id="telaCorrida" class="escondido">
    <h2>Acompanhar minha corrida</h2>

    <div class="status" id="statusCorrida">
      Procurando motorista...
    </div>

    <div id="dadosMotorista" class="motorista escondido"></div>

    <div id="areaChat" class="escondido">
      <h2 style="margin-top:25px">Chat com o motorista</h2>
      <div id="mensagens"></div>

      <label for="textoMensagem">Sua mensagem</label>
      <input id="textoMensagem" type="text" maxlength="1000" placeholder="Digite uma mensagem">

      <button id="btnEnviar" onclick="enviarMensagem()">ENVIAR MENSAGEM</button>
    </div>

    <button id="btnNovaCorrida" class="secundario escondido" onclick="novaCorrida()">
      SOLICITAR OUTRA CORRIDA
    </button>

    <div class="aviso">
      Esta página atualiza automaticamente o andamento da sua corrida.
    </div>
  </section>
</div>

<script>
/* CONFIGURAÇÃO SUPABASE */
const SUPABASE_URL = "https://xfwkwcpnyvhvmreidqck.supabase.co";
const SUPABASE_KEY = "sb_publishable_S9Ztcv3nh0EhzUl8VMeLmg_nQuBJ1hR";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* ESTADO DA CORRIDA */
let corridaId = sessionStorage.getItem("nerocar_corrida_id");
let passageiroToken = sessionStorage.getItem("nerocar_passageiro_token");
let intervaloAcompanhamento = null;
let intervaloMensagens = null;
let ultimoStatus = "";

/* ELEMENTOS */
const telaSolicitacao = document.getElementById("telaSolicitacao");
const telaCorrida = document.getElementById("telaCorrida");
const statusCorrida = document.getElementById("statusCorrida");
const dadosMotorista = document.getElementById("dadosMotorista");
const areaChat = document.getElementById("areaChat");
const mensagens = document.getElementById("mensagens");
const btnSolicitar = document.getElementById("btnSolicitar");

/* PROTEÇÃO DE TEXTO */
function escaparHTML(valor){
  return String(valor ?? "").replace(/[&<>"']/g, caractere => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[caractere]);
}

/* NORMALIZA RESPOSTAS DO SUPABASE */
function primeiroRegistro(dados){
  if(Array.isArray(dados)) return dados[0] || null;
  return dados || null;
}

/* SOLICITAR CORRIDA */
async function solicitarCorrida(){
  const nome = document.getElementById("nome").value.trim();
  const endereco = document.getElementById("endereco").value.trim();
  const referencia = document.getElementById("referencia").value.trim();

  if(!nome || !endereco){
    alert("Preencha seu nome e o endereço de origem.");
    return;
  }

  btnSolicitar.disabled = true;
  btnSolicitar.textContent = "SOLICITANDO...";
  document.getElementById("mensagemInicial").textContent = "Estamos procurando um motorista disponível...";

  try{
    const {data,error} = await db.rpc("solicitar_corrida",{
      p_nome:nome,
      p_endereco:endereco,
      p_referencia:referencia || null
    });

    if(error) throw error;

    const resultado = primeiroRegistro(data);

    if(!resultado || resultado.success === false){
      throw new Error(resultado?.message || "Não foi possível solicitar a corrida.");
    }

    const id = resultado.ride_id || resultado.id;
    const token = resultado.passenger_token;

    if(!id || !token){
      throw new Error("A corrida foi criada, mas não recebemos os dados de acompanhamento. Entre em contato com a Nerocar.");
    }

    corridaId = id;
    passageiroToken = token;

    sessionStorage.setItem("nerocar_corrida_id",String(corridaId));
    sessionStorage.setItem("nerocar_passageiro_token",String(passageiroToken));

    telaSolicitacao.classList.add("escondido");
    telaCorrida.classList.remove("escondido");

    statusCorrida.innerHTML = '<span class="destaque">Corrida solicitada!</span><br>Estamos aguardando a confirmação do motorista.';

    if(resultado.driver_name){
      mostrarMotorista(resultado);
    }

    iniciarAcompanhamento();

  }catch(error){
    console.error("Erro ao solicitar corrida:",error);
    document.getElementById("mensagemInicial").innerHTML =
      '<span class="erro">Não foi possível solicitar: ' +
      escaparHTML(error.message || "Erro desconhecido") +
      '</span>';
  }finally{
    btnSolicitar.disabled = false;
    btnSolicitar.textContent = "SOLICITAR CORRIDA";
  }
}

/* MOSTRAR MOTORISTA */
function mostrarMotorista(dados){
  dadosMotorista.classList.remove("escondido");

  dadosMotorista.innerHTML = `
    <strong class="destaque">Motorista encaminhado para sua corrida</strong><br>
    <strong>Nome:</strong> ${escaparHTML(dados.driver_name || "Aguardando")}<br>
    <strong>Veículo:</strong> ${escaparHTML(dados.vehicle_model || "-")}<br>
    <strong>Cor:</strong> ${escaparHTML(dados.vehicle_color || "-")}<br>
    <strong>Placa:</strong> ${escaparHTML(dados.vehicle_plate || "-")}
  `;
}

/* ACOMPANHAR CORRIDA */
function iniciarAcompanhamento(){
  if(intervaloAcompanhamento) clearInterval(intervaloAcompanhamento);
  if(intervaloMensagens) clearInterval(intervaloMensagens);

  acompanharCorrida();
  carregarMensagens();

  intervaloAcompanhamento = setInterval(acompanharCorrida,5000);
  intervaloMensagens = setInterval(carregarMensagens,4000);
}

async function acompanharCorrida(){
  if(!corridaId || !passageiroToken) return;

  try{
    const {data,error} = await db.rpc("acompanhar_corrida",{
      p_corrida_id:corridaId,
      p_token:passageiroToken
    });

    if(error) throw error;

    const corrida = primeiroRegistro(data);

    if(!corrida){
      statusCorrida.textContent = "Não foi possível localizar sua corrida.";
      return;
    }

    const status = String(corrida.status || "").toLowerCase();

    if(corrida.driver_name){
      mostrarMotorista(corrida);
    }

    if(status === "pending"){
      statusCorrida.innerHTML =
        '<span class="destaque">Motorista acionado!</span><br>Aguardando o motorista aceitar sua corrida.';
      areaChat.classList.remove("escondido");
    }
    else if(status === "accepted"){
      statusCorrida.innerHTML =
        '<span class="sucesso">Motorista confirmou sua corrida!</span><br>Seu motorista está a caminho.';
      areaChat.classList.remove("escondido");
    }
    else if(status === "completed"){
      statusCorrida.innerHTML =
        '<span class="sucesso">Corrida finalizada!</span><br>Obrigado por viajar com a Nerocar.';
      areaChat.classList.add("escondido");
      btnNovaCorrida.classList.remove("escondido");
      pararAtualizacoes();
    }
    else if(status === "cancelled"){
      statusCorrida.innerHTML =
        '<span class="erro">Esta corrida foi cancelada.</span><br>Você pode solicitar outra corrida.';
      areaChat.classList.add("escondido");
      btnNovaCorrida.classList.remove("escondido");
      pararAtualizacoes();
    }
    else{
      statusCorrida.textContent = "Atualizando informações da corrida...";
    }

    ultimoStatus = status;

  }catch(error){
    console.error("Erro ao acompanhar corrida:",error);
  }
}

/* CHAT: CARREGAR MENSAGENS */
async function carregarMensagens(){
  if(!corridaId || !passageiroToken) return;
  if(areaChat.classList.contains("escondido")) return;

  try{
    const {data,error} = await db.rpc("listar_mensagens_corrida",{
      p_corrida_id:corridaId,
      p_token:passageiroToken
    });

    if(error) throw error;

    const lista = Array.isArray(data) ? data : [];

    const html = lista.map(item=>{
      const hora = item.created_at
        ? new Date(item.created_at).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})
        : "";

      return `
        <div class="mensagem">
          <strong>${escaparHTML(item.sender_name || "Usuário")}</strong><br>
          ${escaparHTML(item.message)}
          <div class="horario">${escaparHTML(hora)}</div>
        </div>
      `;
    }).join("");

    const estavaNoFinal =
      mensagens.scrollHeight - mensagens.scrollTop - mensagens.clientHeight < 50;

    mensagens.innerHTML = html || '<div class="aviso">Nenhuma mensagem ainda.</div>';

    if(estavaNoFinal){
      mensagens.scrollTop = mensagens.scrollHeight;
    }

  }catch(error){
    console.error("Erro ao carregar mensagens:",error);
  }
}

/* CHAT: ENVIAR MENSAGEM */
async function enviarMensagem(){
  const campo = document.getElementById("textoMensagem");
  const texto = campo.value.trim();
  const botao = document.getElementById("btnEnviar");

  if(!texto) return;

  botao.disabled = true;

  try{
    const {data,error} = await db.rpc("enviar_mensagem_corrida",{
      p_corrida_id:corridaId,
      p_mensagem:texto,
      p_token:passageiroToken
    });

    if(error) throw error;

    const resultado = primeiroRegistro(data);

    if(resultado && resultado.success === false){
      throw new Error(resultado.message || "Não foi possível enviar a mensagem.");
    }

    campo.value = "";
    await carregarMensagens();

  }catch(error){
    console.error("Erro ao enviar mensagem:",error);
    alert("Não foi possível enviar a mensagem: " + error.message);
  }finally{
    botao.disabled = false;
    campo.focus();
  }
}

/* ENTER ENVIA MENSAGEM */
document.getElementById("textoMensagem").addEventListener("keydown",function(event){
  if(event.key === "Enter"){
    event.preventDefault();
    enviarMensagem();
  }
});

/* PARAR ATUALIZAÇÕES */
function pararAtualizacoes(){
  if(intervaloAcompanhamento) clearInterval(intervaloAcompanhamento);
  if(intervaloMensagens) clearInterval(intervaloMensagens);
  intervaloAcompanhamento = null;
  intervaloMensagens = null;
}

/* NOVA CORRIDA */
function novaCorrida(){
  pararAtualizacoes();

  sessionStorage.removeItem("nerocar_corrida_id");
  sessionStorage.removeItem("nerocar_passageiro_token");

  corridaId = null;
  passageiroToken = null;
  ultimoStatus = "";

  document.getElementById("nome").value = "";
  document.getElementById("endereco").value = "";
  document.getElementById("referencia").value = "";

  dadosMotorista.innerHTML = "";
  dadosMotorista.classList.add("escondido");
  areaChat.classList.add("escondido");
  btnNovaCorrida.classList.add("escondido");

  mensagens.innerHTML = "";

  telaCorrida.classList.add("escondido");
  telaSolicitacao.classList.remove("escondido");
}

/* RECUPERAR CORRIDA SE A PÁGINA FOR REABERTA */
if(corridaId && passageiroToken){
  telaSolicitacao.classList.add("escondido");
  telaCorrida.classList.remove("escondido");
  statusCorrida.textContent = "Recuperando informações da sua corrida...";
  iniciarAcompanhamento();
}
</script>

</body>
</html>
